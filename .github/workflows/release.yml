name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build without moving it
        required: true
        default: v0.3.0
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source on macOS
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read

  release:
    needs: verify
    name: Prepare ad-hoc unnotarized macOS prerelease
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Check tag and all application versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Install signature-verification dependency
        run: command -v rg >/dev/null || brew install ripgrep
      - name: Build and verify ad-hoc Universal DMG and SHA-256
        run: ./scripts/build-macos-universal.sh
      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          draft: true
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES_0.3.0.md
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sha256
