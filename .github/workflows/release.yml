name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source on macOS
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    name: Prepare ad-hoc unnotarized macOS prerelease
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Check tag and all application versions
        run: node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
      - name: Build and verify ad-hoc Universal DMG and SHA-256
        run: ./scripts/build-macos-universal.sh
      - name: Create draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES_0.3.0.md
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sha256
